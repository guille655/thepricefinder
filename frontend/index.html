<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ThePriceFinder</title>
    <meta name="description" content="Bienvenido a ThePriceFinder" />
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>📈</text></svg>">
    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
      :root { --bg: #fff; --fg: #000; }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--fg);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Apple Color Emoji", "Segoe UI Emoji";
      }
      main {
        min-height: 100svh;
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 4rem; /* Menos padding vertical */
      }

      h1 {
        margin: 0;
        text-align: center;
        font-weight: 800;
        line-height: 1.1;
        font-size: clamp(2rem, 6vw, 4rem);
        letter-spacing: -0.02em;
      }
    
    .buttons {
  margin-top: 0.75rem;
  display: flex;
  gap: 1rem;
}

.btn {
  background-color: #007bff; /* Azul */
  color: white;
  text-decoration: none;
  padding: 0.75rem 1.5rem;
  border-radius: 8px;
  font-weight: 600;
  transition: background-color 0.2s ease;
}

.btn:hover {
  background-color: #0056b3; /* Azul más oscuro en hover */
}  

.hero-image {
  margin-top: 1rem;
  display: flex;
  justify-content: center;
}

.hero-image img {
  max-width: 400px; /* ajusta el tamaño máximo */
  width: 100%;
  height: auto;
}

.subtitle {
  font-family: "Inter", sans-serif;
  font-size: 1.125rem; /* aprox 18px, más pequeño que el h1 */
  font-weight: 400;
  text-align: center;
  max-width: 600px;
  margin: 1rem auto 0;
  line-height: 1.5;
  color: var(--fg);
}

.top-bar {
  width: 100%;
  height: 50px; /* altura de la barra, puedes ajustar */
  background-color: #f0f0f0; /* gris claro */
}

    </style>
  </head>
  <body>
    <main role="main" aria-label="Bienvenida">
      <div class="top-bar"></div>
      <h1>Bienvenido a ThePriceFinder</h1>
      <div class="buttons">
        <a href="login.html" class="btn">Log In</a>
        <a href="signup.html" class="btn">Sign Up</a>
      </div>
      
      <div class="hero-image">
      <img src="images/imagenlandingpage.png" alt="Ilustración buscador de precios">
      </div>

      <p class="subtitle">
      Descubre los precios de tus productos en los principales marketplaces europeos y adelántate a tus competidores.
      </p>

    </main>
  </body>
</html>
